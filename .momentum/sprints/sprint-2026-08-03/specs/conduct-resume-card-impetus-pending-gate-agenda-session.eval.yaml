story_slug: conduct-resume-card-impetus-pending-gate-agenda-session
verification_method: skill-invoke
harness_profile: skill-invoke
contract_path: .momentum/sprints/sprint-2026-08-03/specs/conduct-resume-card-impetus-pending-gate-agenda-session.eval.yaml
how_dev_self_checks: |
  Run a conduct build to its end-gate and confirm .momentum/sprints/<sprint-slug>/resume-card.json
  exists on disk with status "pending" and exactly one pending question that says what it gates.
  Start a fresh session and confirm the greeting leads with that question; repeat two more times
  and confirm each repeat adds only a single how-long-waited line while the card stays "pending"
  and never becomes failed or expired. Resolve the gate, start one more session, and confirm the
  greeting is back to the normal clean-start greeting.
coverage_disposition: dedicated-run
covered_by_scenario: null
acceptance_criteria_ref: .momentum/stories/conduct-resume-card-impetus-pending-gate-agenda-session.md#acceptance-criteria
